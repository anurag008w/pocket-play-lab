function nativeRobot(){const courses=[{start:12,goal:3,walls:[5,6,10],stars:[13,15,7]},{start:0,goal:15,walls:[1,5,9],stars:[4,12,14]},{start:3,goal:12,walls:[6,7,10],stars:[2,0,8]},{start:15,goal:0,walls:[4,5,9],stars:[11,3,1]}],arrows=['↑','→','↓','←'],names=['up','right','down','left'];let course=0,queue=[],pos=12,at=0,collected=new Set(),state='ready',timer=null,speed=600,palette=0,wins=new Set(),note='Add arrows, then step or run.';$('nativeStage').innerHTML=`<div class="robot-play"><p class="caption">Guide the little robot to the ring. Pick up sparks if you like. Tap an arrow chip to remove it.</p><div id="robotCount" class="count"></div><div id="robotBoard" class="robot-board" role="group" aria-label="Robot course"></div><p id="robotStatus" class="caption" role="status" aria-live="polite"></p><div id="robotQueue" class="robot-queue" aria-label="Arrow path"></div><div class="robot-arrows">${arrows.map((a,i)=>`<button data-robotadd="${i}" aria-label="Add ${names[i]}">${a}</button>`).join('')}</div><div class="robot-controls"><button id="robotStep">One step</button><button id="robotRun">Run path</button><button id="robotUndo">Remove last</button><button id="robotClear">Clear arrows</button><button id="robotRewind">Rewind robot</button><button id="robotCourse">Next course</button><button id="robotSpeed">Speed: gentle</button><button id="robotPalette">Palette: garden</button><button id="robotReset">Start over</button></div><p id="robotWins" class="caption"></p></div>`;function stop(){clearInterval(timer);timer=null}function rewind(){stop();pos=courses[course].start;at=0;collected=new Set();state='ready';note='Add arrows, then step or run.';paint()}function step(){if(state!=='ready')return;if(at>=queue.length){note='Path ended. Add arrows or rewind and try again.';stop();paint();return}let cmd=queue[at++],row=Math.floor(pos/4),col=pos%4,newpos=pos+[-4,1,4,-1][cmd];if(cmd===0&&row===0||cmd===1&&col===3||cmd===2&&row===3||cmd===3&&col===0){state='blocked';note='Board edge. Rewind and change the path.';stop()}else if(courses[course].walls.includes(newpos)){state='blocked';note='A wall. Rewind and change the path.';stop()}else{pos=newpos;if(courses[course].stars.includes(pos))collected.add(pos);if(pos===courses[course].goal){state='win';wins.add(course);note=`Ring reached! ${collected.size}/3 sparks collected.`;stop()}else if(at>=queue.length){note='Path ended. Add arrows or rewind and try again.';stop()}else note='The robot is following your arrows.'}paint()}function paint(){const c=courses[course],colors=[['#76a99e','#c3cced'],['#b78971','#99b8d0'],['#929d71','#c199c5']][palette];$('robotBoard').style.setProperty('--robotA',colors[0]);$('robotBoard').style.setProperty('--robotB',colors[1]);$('robotCount').textContent=`Course ${course+1}/4 · ${collected.size}/3 sparks · step ${at}/${queue.length}`;$('robotStatus').textContent=note;$('robotBoard').innerHTML=Array.from({length:16},(_,i)=>`<div class="robot-cell ${c.walls.includes(i)?'wall':''} ${i===c.goal?'goal':''}" aria-label="Row ${Math.floor(i/4)+1}, column ${i%4+1}${i===pos?', robot':''}${c.walls.includes(i)?', wall':''}${i===c.goal?', ring':''}${c.stars.includes(i)&&!collected.has(i)?', spark':''}">${i===pos?'<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 20H50V50H14ZM32 20V11M28 10H36M8 30V41M56 30V41M22 50V56M42 50V56M23 31H24M40 31H41M24 41H40"/></svg>':c.walls.includes(i)?'▧':c.stars.includes(i)&&!collected.has(i)?'✧':i===c.goal?'○':'·'}</div>`).join('');$('robotQueue').innerHTML=queue.map((v,i)=>`<button data-robotremove="${i}" ${timer?'disabled':''} class="${i<at?'used':''}" aria-label="Remove arrow ${i+1}, ${names[v]}">${arrows[v]}</button>`).join('')||'<span>No arrows yet.</span>';document.querySelectorAll('[data-robotremove]').forEach(b=>b.onclick=()=>{queue.splice(+b.dataset.robotremove,1);rewind()});document.querySelectorAll('[data-robotadd]').forEach(b=>b.disabled=queue.length>=12||!!timer);$('robotStep').disabled=state!=='ready'||at>=queue.length||!!timer;$('robotRun').disabled=state!=='ready'||at>=queue.length;$('robotRun').textContent=timer?'Pause':'Run path';$('robotUndo').disabled=!queue.length||!!timer;$('robotClear').disabled=!queue.length;$('robotSpeed').textContent='Speed: '+(speed===600?'gentle':'quick');$('robotPalette').textContent='Palette: '+['garden','dusk','orchard'][palette];$('robotWins').textContent=`Rings reached: ${wins.size}/4`;}document.querySelectorAll('[data-robotadd]').forEach(b=>b.onclick=()=>{if(queue.length>=12||timer)return;queue.push(+b.dataset.robotadd);note='Arrow added. Step or run when ready.';paint()});$('robotStep').onclick=step;$('robotRun').onclick=()=>{if(timer){stop();note='Paused. Step or run to continue.';paint()}else if(state==='ready'&&at<queue.length){timer=setInterval(step,speed);note='Running your path.';paint()}};$('robotUndo').onclick=()=>{queue.pop();rewind()};$('robotClear').onclick=()=>{queue=[];rewind()};$('robotRewind').onclick=rewind;$('robotCourse').onclick=()=>{course=(course+1)%4;queue=[];rewind()};$('robotSpeed').onclick=()=>{speed=speed===600?250:600;if(timer){stop();timer=setInterval(step,speed)}paint()};$('robotPalette').onclick=()=>{palette=(palette+1)%3;paint()};$('robotReset').onclick=()=>{course=palette=0;queue=[];speed=600;wins.clear();rewind()};paint();nativeCleanup=stop;}

function nativePixel(){const palettes=[['#fffaf3','#76a99e','#b7c5ed','#d4a47e','#8e727e','#e4c56d'],['#fcf5f0','#7f9cbd','#b497c6','#d98775','#725e89','#b8c598'],['#faf8ed','#94a16c','#b5cdbb','#b88e6a','#787e92','#d6b56a']];let cells=Array(144).fill(0),color=1,palette=0,mirror=false,fill=false,grid=true,history=[],redo=[],stroke=false,dirty=false;const snap=()=>cells.slice();function remember(){history.push(snap());if(history.length>32)history.shift();redo=[]}function finish(){if(stroke){stroke=false;dirty=false;paint()}}$('nativeStage').innerHTML=`<div class="pixel-play"><p class="caption">Tap or drag to make a tiny picture. Your brush can echo across the middle.</p><svg id="pixelBoard" class="pixel-board" viewBox="0 0 240 240" role="group" aria-label="Twelve by twelve pixel canvas">${cells.map((_,i)=>`<rect data-pixel="${i}" x="${i%12*20}" y="${Math.floor(i/12)*20}" width="20" height="20" tabindex="0" role="button" aria-label="Paint row ${Math.floor(i/12)+1}, column ${i%12+1}"/>`).join('')}</svg><p id="pixelCount" class="caption" role="status" aria-live="polite"></p><div id="pixelColors" class="pixel-colors"></div><div class="pixel-controls"><button id="pixelMirror">Mirror: off</button><button id="pixelFill">Tool: brush</button><button id="pixelGrid">Grid: on</button><button id="pixelPalette">Palette: garden</button><button id="pixelUndo">Undo</button><button id="pixelRedo">Redo</button><button id="pixelRotate">Turn picture</button><button id="pixelAll">Fill canvas</button><button id="pixelClear">Clear canvas</button><button id="pixelReset">Start over</button></div><div class="pixel-templates"><button data-pixeltemplate="0">Star</button><button data-pixeltemplate="1">Rain</button><button data-pixeltemplate="2">Leaf</button></div></div>`;const board=$('pixelBoard');function paint(){const p=palettes[palette];board.querySelectorAll('rect').forEach((el,i)=>{el.setAttribute('fill',p[cells[i]]);el.setAttribute('stroke',grid?'#ffffff55':'none');el.setAttribute('stroke-width','0.7');el.dataset.ink=cells[i]});$('pixelCount').textContent=`${cells.filter(v=>v!==0).length}/144 coloured squares`;$('pixelColors').innerHTML=p.map((c,i)=>`<button data-pixelcolor="${i}" aria-label="${i?'Colour '+i:'Eraser'}" aria-pressed="${color===i}" style="--swatch:${c}">${i===0?'×':''}</button>`).join('');document.querySelectorAll('[data-pixelcolor]').forEach(b=>b.onclick=()=>{color=+b.dataset.pixelcolor;paint()});$('pixelMirror').textContent='Mirror: '+(mirror?'on':'off');$('pixelFill').textContent='Tool: '+(fill?'fill':'brush');$('pixelGrid').textContent='Grid: '+(grid?'on':'off');$('pixelPalette').textContent='Palette: '+['garden','dusk','orchard'][palette];$('pixelUndo').disabled=!history.length;$('pixelRedo').disabled=!redo.length;$('pixelClear').disabled=!cells.some(Boolean)}function apply(i){if(i<0||i>=144)return;if(!dirty){remember();dirty=true}if(fill){const old=cells[i];if(old!==color){const todo=[i],seen=new Set;while(todo.length){const j=todo.pop();if(seen.has(j)||cells[j]!==old)continue;seen.add(j);cells[j]=color;const r=Math.floor(j/12),c=j%12;if(r)todo.push(j-12);if(r<11)todo.push(j+12);if(c)todo.push(j-1);if(c<11)todo.push(j+1)}}}else{cells[i]=color;if(mirror)cells[Math.floor(i/12)*12+11-i%12]=color}paint()}function hit(e){const r=board.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*12),y=Math.floor((e.clientY-r.top)/r.height*12);return x<0||x>11||y<0||y>11?-1:y*12+x}board.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();stroke=true;dirty=false;board.setPointerCapture(e.pointerId);apply(hit(e))};board.onpointermove=e=>{if(stroke&&!fill)apply(hit(e))};board.onpointerup=board.onpointercancel=finish;board.onlostpointercapture=finish;board.querySelectorAll('rect').forEach((el,i)=>{el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dirty=false;apply(i);dirty=false}}});$('pixelMirror').onclick=()=>{mirror=!mirror;paint()};$('pixelFill').onclick=()=>{fill=!fill;paint()};$('pixelGrid').onclick=()=>{grid=!grid;paint()};$('pixelPalette').onclick=()=>{palette=(palette+1)%3;paint()};$('pixelUndo').onclick=()=>{if(!history.length)return;redo.push(snap());cells=history.pop();paint()};$('pixelRedo').onclick=()=>{if(!redo.length)return;history.push(snap());cells=redo.pop();paint()};$('pixelRotate').onclick=()=>{remember();const old=snap();cells=old.map((_,i)=>old[(11-i%12)*12+Math.floor(i/12)]);paint()};$('pixelAll').onclick=()=>{remember();cells.fill(color);paint()};$('pixelClear').onclick=()=>{remember();cells.fill(0);paint()};document.querySelectorAll('[data-pixeltemplate]').forEach(b=>b.onclick=()=>{remember();cells.fill(0);let t=+b.dataset.pixeltemplate;for(let y=0;y<12;y++)for(let x=0;x<12;x++){const star=[[5.5,.5],[7,4],[10.5,4],[8,6.5],[9,10.5],[5.5,8.5],[2,10.5],[3,6.5],[.5,4],[4,4]];let inside=false;for(let a=0,b=star.length-1;a<star.length;b=a++){let [ax,ay]=star[a],[bx,by]=star[b];if((ay>y)!==(by>y)&&x<(bx-ax)*(y-ay)/(by-ay)+ax)inside=!inside}let on=t===0?inside:t===1?(y>=2&&y<=4&&x>=2&&x<=9)||(y>=7&&y<=9&&[3,6,9].includes(x+y%2)):x+y>=7&&x+y<=13&&Math.abs(x-y)<=4;cells[y*12+x]=on?(t===2&&x===y?1:t+1):0}paint()});$('pixelReset').onclick=()=>{cells.fill(0);color=1;palette=0;mirror=fill=false;grid=true;history=[];redo=[];paint()};paint();nativeCleanup=()=>{stroke=false;board.onpointerdown=board.onpointermove=board.onpointerup=board.onpointercancel=board.onlostpointercapture=null};}

function nativeClicker(){let taps=0,palette=0,scene=0,selected=-1,history=[];const names=['Tiny cloud','Pocket moon','Leaf boat','Soft star','Rain drop','Little lantern'],paths=['M10 40Q2 24 20 23Q22 7 38 17Q54 12 53 29Q65 40 51 44H16Z','M43 8A24 24 0 1 0 55 43A24 24 0 0 1 43 8Z','M8 41H56L45 53H20ZM32 9V38H14ZM36 15L52 36H36Z','M32 7L40 24L58 27L44 40L48 58L32 48L16 58L20 40L6 27L24 24Z','M32 8Q8 34 18 48Q32 60 46 48Q56 34 32 8Z','M20 18H44V50H20ZM24 18Q20 2 32 5Q44 2 40 18M18 54H46M32 25V43M27 31H37'];const colors=[['#76a99e','#c5cfee','#e4be73'],['#899bc0','#cb9a88','#bcb082'],['#929f70','#c49abc','#d5b16f']];$('nativeStage').innerHTML=`<div class="clicker-play"><p class="caption">A few gentle taps grow a little bloom. Six small charms wait inside. No timer.</p><button id="clickerTap" class="clicker-tap" aria-label="Give the bloom one tap"><svg id="clickerArt" viewBox="0 0 300 260" aria-hidden="true"></svg></button><div id="clickerCount" class="count" role="status" aria-live="polite"></div><p id="clickerNote" class="caption"></p><div id="clickerCharms" class="clicker-charms" aria-label="Charm collection"></div><div id="clickerPreview" class="clicker-preview"></div><div class="clicker-controls"><button id="clickerUndo">Undo</button><button id="clickerPalette">Palette: garden</button><button id="clickerScene">Scene: meadow</button><button id="clickerReset">Start over</button></div></div>`;function remember(){history.push({taps,palette,scene,selected});if(history.length>32)history.shift()}function charm(i){return `<svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[i]}"/></svg>`}function paint(){const [a,b,c]=colors[palette],stage=Math.min(6,Math.floor(taps/6)),h=stage*20;let petals=Array.from({length:6},(_,i)=>`<ellipse cx="150" cy="${190-h-17}" rx="12" ry="24" transform="rotate(${i*60} 150 ${190-h})" fill="${b}"/>`).join('');$('clickerArt').innerHTML=`<rect width="300" height="260" rx="24" fill="${scene===0?'#f4f5eb':scene===1?'#eff1f8':'#f8efea'}"/>${scene===0?`<circle cx="247" cy="43" r="20" fill="${c}"/>`:scene===1?'<path d="M243 24A22 22 0 1 0 267 58A21 21 0 0 1 243 24Z" fill="#c1c9e8"/>':'<path d="M28 29L20 42M54 29L46 42M80 29L72 42M228 29L220 42M254 29L246 42" stroke="#b9c8e9" stroke-width="3"/>'}<path d="M30 220Q150 196 270 220" stroke="${a}" stroke-width="3" fill="none"/>${stage?`<path d="M150 210V${190-h}" stroke="${a}" stroke-width="5"/>`:''}${stage>=2?`<path d="M150 170Q102 145 111 178Q123 189 150 180M150 149Q198 124 191 158Q177 171 150 158" fill="${a}"/>`:''}${stage>=4?petals:stage>=1?`<ellipse cx="150" cy="${190-h}" rx="${10+stage*3}" ry="${14+stage*2}" fill="${b}"/>`:`<ellipse cx="150" cy="204" rx="17" ry="9" fill="${c}"/>`}${stage>=4?`<circle cx="150" cy="${190-h}" r="14" fill="${c}"/>`:''}${stage>=5?`<path d="M67 93V111M58 102H76M235 112V130M226 121H244" stroke="${c}" stroke-width="3"/>`:''}${stage===6?`<circle cx="66" cy="157" r="5" fill="${b}"/><circle cx="219" cy="75" r="5" fill="${a}"/>`:''}`;$('clickerTap').disabled=taps>=36;$('clickerCount').textContent=`${taps}/36 taps · ${stage}/6 charms`;$('clickerNote').textContent=taps===36?'Your little bloom is complete. Look at the charms, undo, or start again.':`${6-taps%6} taps to the next charm. Go at your own pace.`;$('clickerCharms').innerHTML=names.map((n,i)=>`<button data-clickercharm="${i}" ${i>=stage?'disabled':''} aria-label="${i<stage?n:'Unopened charm '+(i+1)}" aria-pressed="${selected===i}" style="color:${a}">${i<stage?charm(i):'·'}</button>`).join('');document.querySelectorAll('[data-clickercharm]').forEach(el=>el.onclick=()=>{selected=+el.dataset.clickercharm;paint()});$('clickerPreview').innerHTML=selected>=0&&selected<stage?`<div style="color:${a}">${charm(selected)}</div><p>${names[selected]}</p>`:'<p class="caption">Open a charm when it appears.</p>';$('clickerUndo').disabled=!history.length;$('clickerPalette').textContent='Palette: '+['garden','dusk','orchard'][palette];$('clickerScene').textContent='Scene: '+['meadow','moonlight','rain'][scene]}$('clickerTap').onclick=()=>{if(taps>=36)return;remember();taps++;if(taps%6===0)selected=taps/6-1;paint()};$('clickerUndo').onclick=()=>{let v=history.pop();if(v){({taps,palette,scene,selected}=v);paint()}};$('clickerPalette').onclick=()=>{remember();palette=(palette+1)%3;paint()};$('clickerScene').onclick=()=>{remember();scene=(scene+1)%3;paint()};$('clickerReset').onclick=()=>{taps=palette=scene=0;selected=-1;history=[];paint()};paint();nativeCleanup=()=>{};}
</script></body></html>
