==='star')shape=`<path d="M0 -15L4 -5L15 -4L7 3L10 14L0 8L-10 14L-7 3L-15 -4L-4 -5Z"/>`;if(type==='rock')shape=`<path d="M-13 9L-10 -7L3 -12L15 2L9 12Z"/>`;if(type==='rain')shape=`<path d="M0 -14Q-13 1 -9 8Q0 18 9 8Q13 1 0 -14Z"/>`;if(type==='kite')shape=variant?`<path d="M0 -16L13 0L0 16L-13 0Z M0 16Q10 22 2 27"/>`:`<circle r="13"/><path d="M0 13Q10 22 2 27"/>`;s+=`<g transform="translate(${xx} ${yy}) scale(${variant?.82:1})" fill="${c[variant]}" stroke="#55564f" stroke-width="1.4" stroke-linejoin="round">${shape}</g>`}return s}function stop(){cancelAnimationFrame(frame);frame=0;travelling=false}function paint(p=0){const c=colors[palette],answer=answers[index],top=flipped?1:0,bottom=1-top;let route=chosen??answer??0,y=route===top?85:220,x=38+270*p,wy=150+(y-150)*p;let s=`<rect width="420" height="300" rx="24" fill="${c[2]}"/><path d="M35 150H100Q145 150 172 85H370M100 150Q145 150 172 220H370" fill="none" stroke="#ded9cf" stroke-width="16" stroke-linecap="round"/><path d="M35 150H100Q145 150 172 85H370M100 150Q145 150 172 220H370" fill="none" stroke="#9b958a" stroke-width="2" stroke-dasharray="5 9"/><rect x="205" y="${y-42}" width="180" height="84" rx="22" fill="${c[route]}" opacity="${chosen!==null||answer!==undefined?.2:0}"/>${glyph(rounds[index][2],287,85,top)}${glyph(rounds[index][2],287,220,bottom)}<g id="trackCart" transform="translate(${x} ${wy})"><rect x="-24" y="-23" width="48" height="31" rx="${[12,3,18][wagon]}" fill="${c[0]}" stroke="#55564f" stroke-width="2"/><path d="M-13 -12H13M0 -23V-33" stroke="#fffaf3" stroke-width="3"/><circle cx="-14" cy="12" r="7" fill="#55564f"/><circle cx="14" cy="12" r="7" fill="#55564f"/>${wagon===1?'<path d="M-22 -23L0 -38L22 -23" fill="#e7bd6c"/>':wagon===2?'<circle cy="-23" r="10" fill="#e7bd6c"/>':''}</g>`;$('trackCanvas').innerHTML=s;$('trackCount').textContent=`${index+1} / 8 · ${answers.filter(v=>v!==undefined).length} choices`;$('trackA').textContent=rounds[index][top];$('trackB').textContent=rounds[index][bottom];$('trackA').setAttribute('aria-pressed',String(chosen===top));$('trackB').setAttribute('aria-pressed',String(chosen===bottom));$('trackSend').disabled=chosen===null||travelling;$('trackSend').textContent=answer!==undefined?'Send again':'Send wagon';$('trackBack').disabled=index===0;$('trackNext').disabled=answer===undefined||index===7;$('trackMotion').textContent='Motion: '+(motion?'on':'off');$('trackMotion').setAttribute('aria-pressed',String(motion));$('trackFeedback').textContent=travelling?'On its way...':answer!==undefined?`You picked ${rounds[index][answer].toLowerCase()}.`:chosen===null?'Tap either track.':rounds[index][chosen]+': ready.';$('trackBook').innerHTML=rounds.map((r,i)=>`<button data-trackvisit="${i}" ${i!==index&&answers[i]===undefined?'disabled':''} class="${i===index?'active':''}" aria-label="Round ${i+1}: ${answers[i]===undefined?'not chosen':r[answers[i]]}">${i+1}${answers[i]===undefined?'':' · '+(answers[i]===0?'A':'B')}</button>`).join('');document.querySelectorAll('[data-trackvisit]').forEach(b=>b.onclick=()=>visit(+b.dataset.trackvisit))}function visit(i){stop();index=i;chosen=answers[i]??null;paint(answers[i]!==undefined?1:0)}function choose(route){stop();chosen=route;paint()}$('trackA').onclick=()=>choose(flipped?1:0);$('trackB').onclick=()=>choose(flipped?0:1);$('trackSend').onclick=()=>{if(chosen===null||travelling)return;answers[index]=chosen;if(!motion){paint(1);return}travelling=true;start=performance.now();function tick(t){const p=Math.min(1,(t-start)/800);if(p===1)travelling=false;paint(p);if(p<1)frame=requestAnimationFrame(tick);else frame=0}frame=requestAnimationFrame(tick)};$('trackBack').onclick=()=>{if(index>0){answers.splice(index);visit(index-1)}};$('trackNext').onclick=()=>{if(answers[index]!==undefined&&index<7)visit(index+1)};$('trackSwap').onclick=()=>{stop();flipped=!flipped;paint(answers[index]!==undefined?1:0)};$('trackTheme').onclick=()=>{stop();palette=(palette+1)%3;$('trackTheme').textContent='Palette: '+['garden','twilight','rose'][palette];paint(answers[index]!==undefined?1:0)};$('trackWagon').onclick=()=>{stop();wagon=(wagon+1)%3;$('trackWagon').textContent='Wagon: '+['round','roof','bubble'][wagon];paint(answers[index]!==undefined?1:0)};$('trackMotion').onclick=()=>{stop();motion=!motion;paint(answers[index]!==undefined?1:0)};$('trackReset').onclick=()=>{stop();index=palette=wagon=0;chosen=null;answers=[];flipped=false;motion=!matchMedia('(prefers-reduced-motion: reduce)').matches;$('trackTheme').textContent='Palette: garden';$('trackWagon').textContent='Wagon: round';paint()};paint();nativeCleanup=stop;}
