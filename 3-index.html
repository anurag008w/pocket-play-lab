<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light"><title>One more round</title><style>:root{--paper:#fffaf3;--ink:#251f21;--soft:#746d64;--line:#e5ded2;--teal:#73a89a;--coffee:#c99b73;--night:#161f2b;--gold:#e7bd6c;--moon:#c2cbec}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}button,a{touch-action:manipulation}button{font:inherit;color:inherit;border:1px solid var(--line);background:#fff;border-radius:14px;min-height:48px;padding:10px 16px;cursor:pointer}button:disabled{cursor:default;opacity:.55}button[aria-pressed=true],button.chosen{background:var(--teal);color:var(--night);font-weight:700}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid var(--coffee);outline-offset:4px}button:active:not(:disabled){transform:scale(.97)}header{max-width:1100px;margin:auto;padding:24px 24px 10px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:750;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.dot{display:inline-block;width:10px;height:10px;background:var(--teal);border-radius:50%;margin-right:9px}main{max-width:1000px;margin:auto;padding:16px 24px 40px}.eyebrow{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}h1{font:normal clamp(32px,5vw,54px)/1.08 Georgia,serif;margin:14px 0 10px}h2{font:normal 26px/1.15 Georgia,serif;margin:8px 0 14px}p{margin:8px 0 16px}.lead{color:var(--soft);font-size:15px}.stage{border-radius:26px;border:1px solid var(--line);background:#fff;padding:22px;min-height:280px;position:relative;overflow:hidden}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0;align-items:center}.tabs button{flex:1;min-width:80px}.status{min-height:26px;margin:14px 0;color:var(--soft);font-size:14px}.caption{font-size:1 zzle button{aspect-ratio:1;font-size:28px;background:#eef4f0}.puzzle .blank{background:var(--paper);border-style:dashed}.target-field{height:300px;position:relative;border-radius:20px;background:var(--night);overflow:hidden}.target{position:absolute;width:64px;height:64px;border-radius:50%;padding:10px;background:var(--gold);border:0;transition:left .12s,top .12s}.connect{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:440px;margin:auto}.drop-controls{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:440px;margin:0 auto 10px}.drop-controls button{padding:0;min-width:0;font-size:20px}.disc{aspect-ratio:1;border-radius:50%;background:#f4efec;border:1px solid var(--line)}.disc.x{background:var(--teal)}.disc.o{background:var(--coffee)}.dice{font-size:64px;padding:30px;text-align:center}.drawer{position:fixed;inset:0;background:var(--paper);z-index:20;overflow:auto;padding:22px;display:none}.drawer.open{display:block}.drawer-inner{max-width:900px;margin:auto}.drawer-head{display:flex;justify-content:space-between;gap:15px;align-items:center;position:sticky;top:-22px;background:var(--paper);padding:16px 0;z-index:1}.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.idea-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;padding:16px 8px;min-height:130px;text-align:center}.idea-tile svg{width:38px;height:38px}.idea-tile .num{font-size:11px;color:var(--soft)}.idea-tile.starred{border:2px solid var(--teal)}dialog{border:1px solid var(--line);border-radius:24px;background:var(--paper);color:var(--ink);padding:24px;max-width:450px;width:calc(100% - 36px)}dialog::backdrop{background:#161f2ba8}dialog a{display:inline-block;border-radius:14px;background:var(--teal);padding:14px 18px;color:var(--night);font-weight:700;text-decoration:none}footer{color:var(--soft);font-size:11px;padding:12px 0}.pulse{animation:pulse .5s ease-out}@keyframes pulse{50%{transform:scale(1.06)}}[hidden]{display:none!important}@media(max-width:620px){header{padding:18px 20px 4px}main{padding:14px 20px 28px}.row{grid-template-columns:1fr;gap:15px}.stage{padding:18px}.picker{grid-template-columns:repeat(3,1fr);gap:9px}.idea-tile{min-height:120px}.controls{gap:8px}.controls button{padding:10px 13px}.drop-controls button{padding:0}.caption{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}} 
</style></head><body><header><span class="brand"><span class="dot"></span>Small joys</span><button id="browse" aria-label="Open arranged external ideas">21 ideas ↗</button></header><main><div class="eyebrow">A little playground</div><h1>One more round</h1><p class="lead">Match. Slide. Catch.</p><div class="controls tabs"><button data-mode="pairs" aria-pressed="true">Pairs</button><button data-mode="puzzle" aria-pressed="false">Slide</button><button data-mode="target" aria-pressed="false">Catch</button></div><div class="stage"><section id="pairs"><div id="cards" class="card-grid"></div><div class="controls"><button id="turn" hidden>Turn over</button></div></section><section id="puzzle" hidden><div id="puzzleBoard" class="puzzle"></div></section><section id="target" hidden><div class="target-field"><button id="catch" class="target" aria-label="Catch the star"></button></div></section><p id="feedback" class="status" role="status" aria-live="polite"></p></div><div class="controls"><button id="reset">New round ↻</button></div>
<footer>No accounts, uploads or tracking. Local play resets on reload.</footer></main><section id="drawer" class="drawer" aria-label="Arranged ideas"><div class="drawer-inner"><div class="drawer-head"><h2>21 ideas</h2><button id="closeDrawer">Close</button></div><p class="caption">Visual reference picker. These open real external sources, not already made local gifts.</p><button id="fav">Favourites</button><div id="tiles" class="picker"></div><div class="controls"><button id="prev">←</button><span id="page"></span><button id="next">→</button></div></div></section><dialog id="ideaDialog"><div class="controls" style="justify-content:space-between"><span id="sourceName" class="caption"></span><button id="closeDialog" aria-label="Close idea">×</button></div><div id="ideaIcon" style="height:70px"></div><h2 id="ideaName"></h2><p id="ideaDetail"></p><p id="ideaCaveat" class="caption"></p><div class="controls"><a id="source" target="_blank" rel="noopener noreferrer">Open source ↗</a><button id="star">Favourite</button></div></dialog><script>const $=id=>document.getElementById(id);const paths={star:'M32 5L39 23L59 25L44 38L48 58L32 47L16 58L20 38L5 25L25 23Z',coffee:'M10 25H44V40Q43 53 28 53Q12 53 10 40ZM44 29H51Q62 38 44 43M9 57H49M19 8Q13 15 19 20M32 8Q26 15 32 20',rain:'M9 30Q10 14 24 18Q27 5 41 13Q51 15 52 25Q66 27 55 37H11Q4 34 9 30ZM20 44L15 55M34 44L29 55M48 44L43 55',knight:'M12 55H51V49H16L24 33L13 28L22 13L36 9L42 19L44 33L50 46H21M25 14L23 6L35 10M16 27L28 25',gift:'M8 24H56V56H8ZM5 15H59V25H5ZM32 15V56M32 15Q4 2 19 4Q29 3 32 15Q39 0 50 6Q59 17 32 15',play:'M20 8L55 32L20 56Z',heart:'M32 56L8 31Q-1 10 17 8Q27 7 32 18Q40 3 52 9Q68 20 56 34Z',grid:'M5 5H59V59H5ZM23 5V59M41 5V59M5 23H59M5 41H59',note:'M17 46V10L49 5V40M17 13L49 8M17 43Q-1 40 5 51Q15 61 17 46M49 37Q29 35 36 48Q48 56 49 40',balloon:'M32 5Q4 4 8 31Q13 55 32 49Q56 55 57 29Q58 4 32 5ZM28 49L32 44L36 49M32 50Q21 60 35 62',palette:'M32 5Q1 5 4 33Q7 59 28 58Q34 58 34 50Q33 40 43 41Q63 44 60 27Q57 5 32 5ZM15 22H17M30 15H32M45 20H47M15 37H17',link:'M27 18L34 11Q52 -3 60 13Q65 21 49 35L42 42M37 46L30 53Q12 67 4 51Q-1 43 15 29L22 22M21 43L43 21'};
function icon(name,cls='icon'){return `<svg class="${cls}" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="${paths[name]||paths.star}"/></svg>`}
function chooseIcon(name){const s=name.toLowerCase();return /cake|gift|box|cookie|egg/.test(s)?'gift':/music|piano|sound|voice|karaoke/.test(s)?'note':/chess|knight/.test(s)?'knight':/draw|art|colour|color|pixel|mandala/.test(s)?'palette':/balloon|bubble/.test(s)?'balloon':/heart|love/.test(s)?'heart':/game|puzzle|sudoku|tic|2048|memory|chess/.test(s)?'grid':'star'}
const ideas=[{"number": 61, "name": "Infinite Craft", "detail": "Combine elements to discover new combinations.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 62, "name": "The Password Game", "detail": "Try to satisfy a deliberately ridiculous password puzzle; never use a real password.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 63, "name": "Draw a Perfect Circle", "detail": "Draw a circle and compare its score.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 64, "name": "Design the next iPhone", "detail": "Drag components into an intentionally silly phone design.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 65, "name": "Absurd Trolley Problems", "detail": "Choose between exaggerated thought-experiment options.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 66, "name": "Let's Settle This", "detail": "Vote in playful either-or polls.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 67, "name": "Ambient Chaos", "detail": "Mix a deliberately unusual sound atmosphere.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 68, "name": "Rocks", "detail": "Try a minimal rock-themed web toy.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 69, "name": "The Auction Game", "detail": "Guess auction prices as a no-money game.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 70, "name": "Spend Bill Gates' Money", "detail": "Play with an imaginary budget, not a real purchase.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 71, "name": "Draw Logos From Memory", "detail": "Sketch familiar logos without looking.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 72, "name": "I'm Not a Robot", "detail": "Try playful fake CAPTCHA-style challenges.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 73, "name": "Sandboxels", "detail": "Experiment with a pixel-simulation sandbox.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 74, "name": "Stimulation Clicker", "detail": "Try a deliberately chaotic clicker game with sound and motion.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required. Sound/flashes/motion; avoid if photosensitive."}, {"number": 75, "name": "Asteroid Launcher", "detail": "Adjust a simulated asteroid and explore its virtual effects.", "url": "https://neal.fun/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 76, "name": "Water Sort", "detail": "Offer a short colour-sorting puzzle session.", "url": "https://www.lofiandgames.com/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 77, "name": "2048", "detail": "Try the sliding tile-combination game.", "url": "https://www.lofiandgames.com/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 79, "name": "Snake", "detail": "Play a short replayable snake arcade challenge.", "url": "https://www.lofiandgames.com/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}, {"number": 84, "name": "Custom photo puzzle", "detail": "Turn an authorised personal photo into a browser jigsaw; publishing uses a credit.", "url": "https://puzzlify.app/en/puzzle-maker/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required. Puzzlify publication uses a credit; free preview is not a published gift. No credit purchased."}, {"number": 85, "name": "Jigsawify picture gift", "detail": "Make an online jigsaw from a chosen picture, after checking upload privacy.", "url": "https://jigsawify.com/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required. Photo upload required for a personalised version. No private photo uploaded."}, {"number": 90, "name": "Lichess birthday game", "detail": "Play an actual chess game together, not a study lesson or fictional board.", "url": "https://lichess.org/", "access": "External source/catalogue. Find the named activity there. Listing checked; full phone playthrough not verified. Internet and device compatibility required."}];let stars=new Set(),only=false,page=0;
function picker(){const a=ideas.filter(x=>!only||stars.has(x.number));page=Math.min(page,Math.max(0,Math.ceil(a.length/12)-1));$('tiles').innerHTML=a.slice(page*12,page*12+12).map(x=>`<button class="idea-tile ${stars.has(x.number)?'starred':''}" data-idea="${x.number}">${icon(chooseIcon(x.name))}<span>${x.name}</span><span class="num">${x.number} · external ↗</span></button>`).join('')||'<p>No favourites yet.</p>';$('page').textContent=`${page+1} / ${Math.max(1,Math.ceil(a.length/12))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*12>=a.length;$('fav').textContent=only?'All ideas':'Favourites';$('tiles').querySelectorAll('button').forEach(b=>b.onclick=()=>openIdea(+b.dataset.idea))}
let selected;function openIdea(n){selected=ideas.find(x=>x.number===n);$('ideaName').textContent=selected.name;$('ideaIcon').innerHTML=icon(chooseIcon(selected.name),'hero-icon');$('ideaDetail').textContent=selected.detail;$('ideaCaveat').textContent='External source, not a completed local gift. Accounts, cost and phone support vary. Nothing is bought or uploaded.';$('source').href=selected.url;$('star').textContent=stars.has(n)?'Remove favourite':'Favourite';$('sourceName').textContent=new URL(selected.url).hostname;$('ideaDialog').showModal()}
$('browse').onclick=()=>{$('drawer').classList.add('open');picker();$('closeDrawer').focus()};$('closeDrawer').onclick=()=>{$('drawer').classList.remove('open');$('browse').focus()};$('closeDialog').onclick=()=>$('ideaDialog').close();$('star').onclick=()=>{stars.has(selected.number)?stars.delete(selected.number):stars.add(selected.number);$('star').textContent=stars.has(selected.number)?'Remove favourite':'Favourite';picker()};$('fav').onclick=()=>{only=!only;page=0;picker()};$('prev').onclick=()=>{page--;picker();$('tiles').scrollIntoView()};$('next').onclick=()=>{page++;picker();$('tiles').scrollIntoView()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ideaDialog').open){$('drawer').classList.remove('open');$('browse').focus()}});

let mode='pairs',round=0,opened=[],matched=[],tries=0,moves=0,caught=0,arr=[],deck=[];const names=['knight','coffee','rain','star'];const layouts=[[0,1,2,3,0,1,2,3],[2,0,3,1,3,2,1,0],[1,3,0,2,2,0,3,1]];
function render(){document.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.mode===mode);$(b.dataset.mode).hidden=b.dataset.mode!==mode});$('cards').innerHTML=deck.map((n,i)=>`<button data-card="${i}" ${matched.includes(i)||(opened.length===2&&!opened.includes(i))?'disabled':''} class="${matched.includes(i)?'matched':''}" aria-label="${opened.includes(i)||matched.includes(i)?names[n]:`Tile ${i+1}`}">${opened.includes(i)||matched.includes(i)?icon(names[n]):'<span style="font-size:34px;color:#73a89a">✦</span>'}<small>${opened.includes(i)||matched.includes(i)?names[n]:i+1}</small></button>`).join('');$('cards').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.card;if(opened.includes(i)||matched.includes(i)||opened.length===2)return;opened.push(i);if(opened.length===2){tries++;if(deck[opened[0]]===deck[opened[1]]){matched.push(...opened);opened=[]}}render()});$('turn').hidden=opened.length!==2;$('puzzleBoard').innerHTML=arr.map((n,i)=>`<button data-cell="${i}" class="${n===0?'blank':''}" aria-label="${n?`Move tile ${n}`:'Empty space'}">${n||' '}</button>`).join('');$('puzzleBoard').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.cell,z=arr.indexOf(0);if(Math.abs(Math.floor(i/3)-Math.floor(z/3))+Math.abs(i%3-z%3)!==1)return;[arr[i],arr[z]]=[arr[z],arr[i]];moves++;render()});$('feedback').textContent=mode==='pairs'?(matched.length===8?'All four pairs found!':`${matched.length/2} / 4 pairs · ${tries} tries`):mode==='puzzle'?(arr.join(',')==='1,2,3,4,5,6,7,8,0'?'All in place!':`${moves} moves · slide beside the gap`):`${caught} / 12 stars`;}
function place(){const pos=[[12,18],[68,45],[38,12],[18,66],[70,70],[48,44],[4,40],[52,75],[28,26],[74,8],[5,74],[40,58]][caught%12];$('catch').style.left=`${pos[0]}%`;$('catch').style.top=`${pos[1]}%`;$('catch').innerHTML=icon('star');$('catch').disabled=caught>=12;}
function reset(){round++;deck=layouts[(round-1)%3];opened=[];matched=[];tries=0;moves=0;caught=0;arr=[1,2,3,4,5,6,7,8,0];let z=8,prev=-1;for(let k=0;k<18;k++){let choices=arr.map((_,i)=>i).filter(i=>i!==prev&&Math.abs(Math.floor(i/3)-Math.floor(z/3))+Math.abs(i%3-z%3)===1),i=choices[Math.floor(Math.random()*choices.length)];[arr[i],arr[z]]=[arr[z],arr[i]];prev=z;z=i}place();render()}
$('turn').onclick=()=>{opened=[];render()};$('catch').onclick=()=>{if(caught<12)caught++;place();render()};$('reset').onclick=reset;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});reset();
</script></body></html>
